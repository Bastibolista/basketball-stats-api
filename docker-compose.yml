services:
  postgres:
    image: postgres:17-alpine
    container_name: basketball-stats-postgres
    environment:
      POSTGRES_DB: basketball_stats
      POSTGRES_USER: basketball_stats
      POSTGRES_PASSWORD: basketball_stats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basketball_stats -d basketball_stats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
