services:
  postgres:
    image: postgres:17-alpine
    container_name: basketball-stats-postgres
    environment:
      POSTGRES_DB: basketball_stats
      POSTGRES_USER: basketball_stats
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basketball_stats -d basketball_stats"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basketball-stats-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: basketball_stats
      DB_USER: basketball_stats
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      APP_AUTH_MODE: local
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?set APP_AUTH_USERNAME in .env}
      APP_AUTH_PASSWORD_HASH: ${APP_AUTH_PASSWORD_HASH:?set APP_AUTH_PASSWORD_HASH in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  postgres-data:
