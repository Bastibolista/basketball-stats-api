spring.application.name=basketball-stats-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:basketball_stats}
spring.datasource.username=${DB_USER:basketball_stats}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# TEMPORARY local-dev auth (self-issued JWT). Replace with Google OIDC at the GCP deployment milestone.
# "google" validates Google ID tokens (production). "local" is the self-issued dev JWT below.
app.auth.mode=${APP_AUTH_MODE:google}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.allowed-emails=${APP_ALLOWED_EMAILS:}

# Only read in local mode. No defaults on purpose: local mode refuses to start without them (see .env.example).
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH}
app.auth.jwt-secret=${APP_JWT_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.version=OPENAPI_3_1

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Per-client-IP, per-minute limits (in-memory, per instance).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
app.rate-limit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:120}

