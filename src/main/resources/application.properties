spring.application.name=basketball-stats-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:basketball_stats}
spring.datasource.username=${DB_USER:basketball_stats}
spring.datasource.password=${DB_PASSWORD:basketball_stats}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# TEMPORARY local-dev auth (self-issued JWT). Replace with Google OIDC at the GCP deployment milestone.
# Default credentials are for local development ONLY: username "bastian", password "changeme123".
app.auth.username=${APP_AUTH_USERNAME:bastian}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH:$2a$10$SfXu7.u.944GVHYXYtMhf.GUSCvtLpAbqztHHt4f3HGk8O/TbY0Dq}
app.auth.jwt-secret=${APP_JWT_SECRET:local-dev-only-secret-CHANGE-ME-before-any-shared-deploy-32bytes}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.version=OPENAPI_3_1

